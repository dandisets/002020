datePublished: '2026-10-04T14:10:36.463557+00:00'
description: "This Dandiset contains spontaneous neural activity data from seven dissociated
  rat cortical cultures recorded during network development using high-density multielectrode
  arrays (HD-MEAs; MaxOne, MaxWell Biosystems). Cultures were prepared from embryonic
  day 18 (E18) rat cortices. Daily recordings captured 30 minutes of spontaneous extracellular
  spiking activity from up to 1,024 electrodes, selected from 26,400 electrodes based
  on the highest mean spike amplitudes.\nThese data were analyzed in the study “Self-organization
  of high-dimensional geometry of neural activity in culture” to investigate how high-dimensional
  population activity emerges during neuronal network development. Analyses examined
  power-law scaling of principal component variance spectra, the spatial organization
  of principal components, and the emergence of neuronal avalanches."
